name: Monitor Telegram gifts

on:
  workflow_dispatch:
  schedule:
    # Every 5 minutes, avoiding minute 0 to reduce GitHub's peak-hour delays.
    - cron: '3-58/5 * * * *'

permissions:
  contents: read

concurrency:
  group: gift-monitor-state
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Restore last counters from GitHub cache
        uses: actions/cache/restore@v4
        with:
          path: .state/gift_tracking.sqlite3
          key: gift-state-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            gift-state-v1-

      - name: Install monitor
        run: python -m pip install -e .

      - name: Read gifts and notify admin only
        id: monitor
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION_STRING: ${{ secrets.TG_SESSION_STRING }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          NOTIFY_CHAT_ID: ${{ secrets.NOTIFY_CHAT_ID }}
          DATABASE_PATH: .state/gift_tracking.sqlite3
          RUN_BUDGET_SECONDS: '210'
          DISCOVERY_ATTEMPTS: '20'
          MAX_NEW_GIFTS_PER_CHECK: '100'
          TIMEZONE: Europe/Kyiv
        run: python -m gift_tracking.actions_monitor

      - name: Checkpoint SQLite before caching
        if: always()
        run: |
          python - <<'PY'
          import sqlite3
          from pathlib import Path

          path = Path('.state/gift_tracking.sqlite3')
          if path.exists():
              with sqlite3.connect(path, timeout=30) as db:
                  result = db.execute('PRAGMA wal_checkpoint(TRUNCATE)').fetchone()
                  if result and result[0]:
                      raise RuntimeError('SQLite checkpoint busy; refusing to cache incomplete state')
                  mode = db.execute('PRAGMA journal_mode=DELETE').fetchone()[0]
                  if mode.lower() != 'delete':
                      raise RuntimeError(f'Could not switch SQLite journal mode: {mode}')
              print('SQLite state checkpointed.')
          else:
              print('No state database to checkpoint.')
          PY

      - name: Persist counters for the next run
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .state/gift_tracking.sqlite3
          key: gift-state-v1-${{ github.run_id }}-${{ github.run_attempt }}
